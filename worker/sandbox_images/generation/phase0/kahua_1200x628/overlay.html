     FINDING (2026-08-10): first pass used DESIGN.md's literal muted token
     (#6B7A88) for the subhead and it was nearly illegible against this
     sky - confirmed by actually rendering and looking, not assumed. Muted
     is tuned for a flat/light surface; it has no guaranteed contrast against
     a variable photograph. Darkened toward ink here (#2E3B45) to stay
     legible while still reading as secondary to the headline. This is a
     per-render judgment call, not a token change - DESIGN.md's muted value
     is untouched, this is a documented photographic-ground exception.

     13px/40px/15px for eyebrow/headline/subhead - wrong on all three, and
     the headline one is worse than a stray number: DESIGN.md's "Applying
     it" section says explicitly, in these words, "An h1 is 48px on every
     canvas. If the headline does not fit at 48, cut the copy; do not scale
     the type." Scaling it to 40px to make it fit directly contradicts that
     instruction. Separately: DESIGN.md's own "Type scale" table lists
     "h1: 56px", which disagrees with the "Applying it" prose's 48px - a
     genuine self-contradiction inside this one file, not a case of an
     external cache disagreeing with DESIGN.md. Resolved in favor of the
     "Applying it" value (48px): it's the more specific, operational
     instruction (it comes with explicit fallback behavior - cut copy,
     don't scale - which only makes sense if 48 is the real constraint),
     whereas the table's 56 reads like a stale/unreviewed figure, the same
     failure mode already seen in Emplifi's tokens.json. Fixed
     eyebrow/subhead to the table's caption/body values (14px/17px, not
     contradicted by any prose), fixed headline to 48px, and repositioned
     everything to fit without overlap - copy was not cut because 48px did
     fit once positions were adjusted. -->
