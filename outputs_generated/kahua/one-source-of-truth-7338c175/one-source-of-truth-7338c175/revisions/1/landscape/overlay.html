<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Barlow"; src: url("assets/barlow_400_normal.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Barlow"; src: url("assets/barlow_500_normal.ttf") format("truetype"); font-weight: 500; }
  @font-face { font-family: "Barlow"; src: url("assets/barlow_600_normal.ttf") format("truetype"); font-weight: 600; }
  @font-face { font-family: "Barlow"; src: url("assets/barlow_700_normal.ttf") format("truetype"); font-weight: 700; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  #canvas {
    position: relative;
    width: 1200px;
    height: 628px;
    overflow: hidden;
    font-family: "Barlow", sans-serif;
  }

  #canvas img.plate {
    position: absolute;
    top: 0;
    left: 0;
    width: 1200px;
    height: 628px;
    display: block;
  }

  .overlay-text {
    position: absolute;
  }

  .eyebrow {
    left: 56px;
    top: 138px;
    width: 360px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #F26B21;
  }

  .headline {
    left: 56px;
    top: 170px;
    width: 360px;
    font-size: 48px;
    font-weight: 700;
    line-height: 1.08;
    color: #FFFFFF;
  }

  .subhead {
    left: 56px;
    top: 348px;
    width: 360px;
    font-size: 17px;
    font-weight: 400;
    line-height: 1.5;
    color: rgba(255,255,255,0.88);
  }

  .stat-number {
    left: 56px;
    top: 470px;
    width: 360px;
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    color: #F26B21;
  }

  .stat-label {
    left: 56px;
    top: 530px;
    width: 360px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.82);
  }

  .logo-wrap {
    position: absolute;
    top: 28px;
    left: 1026px;
    width: 150px;
    height: 52px;
  }

  .logo-wrap img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
</style>
</head>
<body>
  <div id="canvas">
    <img class="plate" src="plate.png" alt="">

    <div class="logo-wrap" data-cq-role="logo">
      <img src="assets/kahua-logo.svg" alt="Kahua">
    </div>

    <div class="overlay-text eyebrow" data-cq-role="text">Capital Program Management</div>

    <div class="overlay-text headline" data-cq-role="text">One platform.<br>One source of truth.</div>

    <div class="overlay-text subhead" data-cq-role="text">Stop reconciling Oracle, SAP, Workday and spreadsheets across every project.</div>

    <div class="overlay-text stat-number" data-cq-role="text">$400B+</div>
    <div class="overlay-text stat-label" data-cq-role="text">Managed on platform</div>
  </div>
</body>
</html>
