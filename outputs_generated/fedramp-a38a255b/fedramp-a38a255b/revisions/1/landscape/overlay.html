<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Barlow';
    src: url('assets/fonts/barlow_400_normal.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Barlow';
    src: url('assets/fonts/barlow_500_normal.ttf') format('truetype');
    font-weight: 500;
  }
  @font-face {
    font-family: 'Barlow';
    src: url('assets/fonts/barlow_600_normal.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Barlow';
    src: url('assets/fonts/barlow_700_normal.ttf') format('truetype');
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 628px; }
  #canvas {
    position: relative;
    width: 1200px;
    height: 628px;
    overflow: hidden;
    background: #FFFFFF;
    font-family: 'Barlow', sans-serif;
  }
  #plate {
    position: absolute;
    top: 0; left: 0;
    width: 1200px;
    height: 628px;
    object-fit: cover;
    display: block;
  }
  .logo {
    position: absolute;
    top: 56px;
    left: 56px;
    width: 150px;
    height: 51.4px;
  }
  .logo img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .eyebrow {
    position: absolute;
    top: 133px;
    left: 56px;
    width: 330px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: #F26B21;
  }
  .headline {
    position: absolute;
    top: 161px;
    left: 56px;
    width: 330px;
    font-size: 48px;
    font-weight: 700;
    line-height: 54px;
    letter-spacing: -0.3px;
    color: #16202B;
  }
  .subhead {
    position: absolute;
    top: 386px;
    left: 56px;
    width: 330px;
    font-size: 17px;
    font-weight: 400;
    line-height: 24px;
    color: #16202B;
  }
</style>
</head>
<body>
  <div id="canvas">
    <img id="plate" src="plate.png" alt="" />
    <div class="logo" data-cq-role="logo">
      <img src="assets/kahua-logo.svg" alt="Kahua" />
    </div>
    <div class="eyebrow" data-cq-role="text">COMPLIANCE</div>
    <div class="headline" data-cq-role="text">FedRAMP certified. 70,000+ projects.</div>
    <div class="subhead" data-cq-role="text">Cleared for defense contractors and public-sector capital programs.</div>
  </div>
</body>
</html>
